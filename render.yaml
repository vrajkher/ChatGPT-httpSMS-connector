services:
  - type: web
    name: chatgpt-android-sms-connector
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: SMSGATE_USERNAME
        sync: false
      - key: SMSGATE_PASSWORD
        sync: false
      - key: SMSGATE_BASE_URL
        value: https://api.sms-gate.app/3rdparty/v1
      - key: CONNECTOR_BEARER_TOKEN
        sync: false
      - key: SMSGATE_WEBHOOK_TOKEN
        sync: false
